<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#221d17">
    <title>VisionBox · Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #18140f; color: #ece3d6;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                     max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }
        .card { text-align: center; max-width: 320px; }
        .card img { width: 72px; height: 72px; margin-bottom: 20px; }
        h1 { font-size: 19px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 14px; color: #a2937f; line-height: 1.5; }
        button {
            margin-top: 24px; padding: 12px 32px; min-height: 44px;
            background: #cda06d; color: #221a12; border: 0; border-radius: 9px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #dbb184; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/static/icons/icon-192.png" alt="">
        <h1>VisionBox is offline</h1>
        <p>Can't reach the server. Check that you're connected to your tailnet, then try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>

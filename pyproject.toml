# Tool configuration only. VisionBox runs from the checkout (scripts put src/ on
# sys.path); it is not packaged.

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "I",    # isort
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Scripts insert src/ on sys.path (and load .env) before importing visionbox.
"scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
